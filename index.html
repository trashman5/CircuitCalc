<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Current Mirror Calculator</title>
  <style>
    .tab-buttons button {
      padding: 8px 20px;
      margin-right: 4px;
      cursor: pointer;
    }
    .tab-buttons button.active {
      font-weight: bold;
      border-bottom: 3px solid black;
    }

    .topology-image {
      display: block;
      margin: 16px 0;
      max-width: 400px;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Current Mirror Calculator</h1>

  <!-- Topology Tabs -->
  <div class="tab-buttons">
    <button class="active" onclick="setTopology('Simple', this)">Simple</button>
    <button onclick="setTopology('Cascode', this)">Cascode</button>
    <button onclick="setTopology('Wilkinson', this)">Wilkinson</button>
  </div>

  <!-- Topology Image -->
  <img id="topology-image" class="topology-image" src="images/Simple.png" alt="Simple Current Mirror Topology">

  <!-- Inputs -->
  <label>Reference Current (A): <input type="number" id="Ref_Current" step="any"></label><br>
  <label>VDD (V):               <input type="number" id="VDD"         step="any"></label><br>
  <label>Width Ratio:           <input type="number" id="Width_Ratio" step="any"></label><br><br>

  <button onclick="calculate()">Calculate</button>
  <button onclick="viewHistory()">View History</button>

  <div id="results"></div>
  <div id="history"></div>

  <script>
    let currentTopology = 'Simple';

    function setTopology(topology, btn) {
      currentTopology = topology;
      document.querySelectorAll('.tab-buttons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Swap the image
      const img = document.getElementById('topology-image');
      img.src = `images/${topology}.png`;
      img.alt = `${topology} Current Mirror Topology`;
    }

    async function calculate() {
      const params = new URLSearchParams({
        Topology:    currentTopology,
        Reference_Current: document.getElementById('Ref_Current').value,
        VDD:         document.getElementById('VDD').value,
        Width_Ratio: document.getElementById('Width_Ratio').value
      });

      const res  = await fetch('Calc?' + params);
      const html = await res.text();
      document.getElementById('results').innerHTML = html;
      document.getElementById('history').innerHTML = '';
    }

    async function viewHistory() {
      const res  = await fetch('viewHistory');
      const html = await res.text();
      document.getElementById('history').innerHTML = html;
      document.getElementById('results').innerHTML = '';
    }
  </script>
</body>
</html>
