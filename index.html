<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Current Mirror Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #ffffff;
      --panel:     #ffffff;
      --border:    #d1d9e0;
      --accent:    #002a6e;
      --accent2:   #0aab6a;
      --muted:     #b0bac4;
      --text:      #1a2230;
      --text-dim:  #7a8fa6;
      --tab-h:     48px;
      --radius:    6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      padding: 40px 24px;
    }



    .container {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    header h1 {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    header span {
      font-size: .8rem;
      color: var(--text-dim);
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 0;
    }

    .tab-bar button {
      position: relative;
      height: var(--tab-h);
      padding: 0 28px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      color: var(--text-dim);
      font-family: 'Rajdhani', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }

    .tab-bar button:hover {
      color: var(--text);
    }

    .tab-bar button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* disabled / placeholder tab */
    .tab-bar button.coming-soon {
      color: var(--muted);
      cursor: default;
    }

    .tab-bar button.coming-soon::after {
      content: 'SOON';
      position: absolute;
      top: 8px;
      right: 6px;
      font-size: .5rem;
      letter-spacing: .1em;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* ── Tab content panel ── */
    .tab-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 28px;
    }

    /* ── Topology image ── */
    .topology-image-wrap {
      background: #f5f7fa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    #topology-image {
      max-width: 100%;
      max-height: 220px;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ── Input grid ── */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .field input {
      background: #f5f7fa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: .95rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    /* ── Action buttons ── */
    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 24px;
      border-radius: var(--radius);
      border: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }

    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { opacity: .85; }

    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Results / History ── */
    #results, #history {
      margin-top: 28px;
    }

    #results:empty, #history:empty { display: none; }

    /* style servlet-returned HTML inside results */
    #results table, #history table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Share Tech Mono', monospace;
      font-size: .9rem;
    }

    #results th, #history th {
      text-align: left;
      padding: 8px 12px;
      background: #f5f7fa;
      color: var(--accent);
      font-weight: 400;
      letter-spacing: .1em;
      border-bottom: 1px solid var(--border);
    }

    #results td, #history td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    #results tr:last-child td, #history tr:last-child td { border-bottom: none; }

    /* any <p> the servlet might return */
    #results p, #history p {
      padding: 6px 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Current Mirror Calc</h1>
    <span>Analog Design Tool</span>
  </header>

  <!-- ── Tab bar ── -->
  <div class="tab-bar">
    <button class="active"    onclick="setTopology('Simple',    this)">Simple</button>
    <button                   onclick="setTopology('Cascode',   this)">Cascode</button>
    <button                   onclick="setTopology('Wilkinson', this)">Wilkinson</button>
    <button class="coming-soon" disabled>LPF</button>
  </div>

  <!-- ── Tab content ── -->
  <div class="tab-panel">

    <!-- Topology schematic -->
    <div class="topology-image-wrap">
      <img id="topology-image" src="images/Simple.png" alt="Simple Current Mirror Topology">
    </div>

    <!-- Inputs -->
    <div class="input-grid">
      <div class="field">
        <label>Ref. Current (A)</label>
        <input type="number" id="Ref_Current" step="any" placeholder="e.g. 0.001">
      </div>
      <div class="field">
        <label>VDD (V)</label>
        <input type="number" id="VDD" step="any" placeholder="e.g. 3.3">
      </div>
      <div class="field">
        <label>Width Ratio</label>
        <input type="number" id="Width_Ratio" step="any" placeholder="e.g. 2">
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary"   onclick="calculate()">Calculate</button>
      <button class="btn btn-secondary" onclick="viewHistory()">View History</button>
    </div>

    <!-- Servlet output -->
    <div id="results"></div>
    <div id="history"></div>

  </div><!-- /tab-panel -->
</div><!-- /container -->

<script>
  let currentTopology = 'Simple';

  function setTopology(topology, btn) {
    currentTopology = topology;
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const img = document.getElementById('topology-image');
    img.src = `images/${topology}.png`;
    img.alt = `${topology} Current Mirror Topology`;

    // clear previous results when switching topology
    document.getElementById('results').innerHTML = '';
    document.getElementById('history').innerHTML = '';
  }

  async function calculate() {
    const params = new URLSearchParams({
      Topology:          currentTopology,
      Reference_Current: document.getElementById('Ref_Current').value,
      VDD:               document.getElementById('VDD').value,
      Width_Ratio:       document.getElementById('Width_Ratio').value
    });

    const res  = await fetch('Calc?' + params);
    const html = await res.text();
    document.getElementById('results').innerHTML = html;
    document.getElementById('history').innerHTML = '';
  }

  async function viewHistory() {
    const res  = await fetch('viewHistory');
    const html = await res.text();
    document.getElementById('history').innerHTML = html;
    document.getElementById('results').innerHTML = '';
  }

  async function deleteEntry(id) {
    if (confirm("Are you sure you want to delete design #" + id + "?")) {
        // 1. Call the Delete Servlet
        const response = await fetch('delete?id=' + id);
        const message = await response.text();
        
        // 2. Show the result in your status bar
        document.getElementById('status-message').innerHTML = message;
        
        // 3. Refresh the history table automatically
        refreshHistory(); 
    }
}
</script>
</body>
</html>
